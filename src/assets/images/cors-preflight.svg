<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Diagramme de séquence CORS avec requête préliminaire OPTIONS preflight">
  <defs>
    <marker id="arr-pre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="arr-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 16px system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .sub { font: 500 12px system-ui, -apple-system, sans-serif; fill: #475569; }
      .actor { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .actor-sub { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e0f2fe; }
      .step { font: 700 12px system-ui, -apple-system, sans-serif; }
      .mono { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .note { font: 600 11.5px system-ui, -apple-system, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect x="8" y="8" width="804" height="314" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="34" text-anchor="middle" class="title">Mécanisme CORS : requête préliminaire (Preflight)</text>
  <text x="410" y="52" text-anchor="middle" class="sub">Appel JavaScript d'une API située sur une autre origine que le front-end</text>

  <!-- Acteurs -->
  <rect x="36" y="64" width="190" height="44" rx="9" fill="#0284c7"/>
  <text x="131" y="83" text-anchor="middle" class="actor">Navigateur (Front)</text>
  <text x="131" y="99" text-anchor="middle" class="actor-sub">https://mon-front.insee.fr</text>
  <line x1="131" y1="108" x2="131" y2="284" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <rect x="594" y="64" width="190" height="44" rx="9" fill="#0f766e"/>
  <text x="689" y="83" text-anchor="middle" class="actor">API Spring Boot</text>
  <text x="689" y="99" text-anchor="middle" class="actor-sub">https://api.insee.fr</text>
  <line x1="689" y1="108" x2="689" y2="284" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 1. Preflight OPTIONS -->
  <text x="410" y="126" text-anchor="middle" class="step" fill="#4338ca">1. OPTIONS /vin  (requête préliminaire automatique du navigateur)</text>
  <text x="410" y="141" text-anchor="middle" class="mono">« Puis-je appeler POST /vin depuis https://mon-front.insee.fr ? »</text>
  <line x1="138" y1="150" x2="678" y2="150" stroke="#6366f1" stroke-width="2.3" marker-end="url(#arr-pre)"/>

  <!-- 2. Réponse Preflight -->
  <text x="410" y="174" text-anchor="middle" class="step" fill="#4338ca">2. 200 OK  (le serveur autorise l'origine et la méthode)</text>
  <text x="410" y="189" text-anchor="middle" class="mono">Access-Control-Allow-Origin: https://mon-front.insee.fr</text>
  <line x1="682" y1="198" x2="142" y2="198" stroke="#6366f1" stroke-width="2.3" stroke-dasharray="6 4" marker-end="url(#arr-pre)"/>

  <!-- 3. Requête réelle -->
  <text x="410" y="224" text-anchor="middle" class="step" fill="#0369a1">3. POST /vin  (requête réelle envoyée après accord)</text>
  <line x1="138" y1="234" x2="678" y2="234" stroke="#0284c7" stroke-width="2.3" marker-end="url(#arr-req)"/>

  <!-- 4. Réponse réelle -->
  <text x="410" y="262" text-anchor="middle" class="step" fill="#047857">4. 201 Created  (+ en-tête Access-Control-Allow-Origin)</text>
  <line x1="682" y1="272" x2="142" y2="272" stroke="#059669" stroke-width="2.3" stroke-dasharray="6 4" marker-end="url(#arr-ok)"/>

  <!-- Note basse -->
  <rect x="44" y="288" width="732" height="26" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="410" y="305" text-anchor="middle" class="note">Tout est géré automatiquement par le navigateur côté client ; sans autorisation CORS valide, il bloque la réponse.</text>
</svg>
