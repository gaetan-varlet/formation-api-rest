<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 360" role="img" aria-label="Architecture d'un test d'intégration boîte noire par HTTP sur Spring Boot">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-ext" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <style>
      .box-title { font: 700 13px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .box-sub { font: 500 11px system-ui, -apple-system, sans-serif; fill: #f1f5f9; }
      .zone-title { font: 700 13px system-ui, -apple-system, sans-serif; fill: #065f46; }
      .app-title { font: 700 12px system-ui, -apple-system, sans-serif; fill: #047857; }
      .ext-title { font: 700 13px system-ui, -apple-system, sans-serif; fill: #92400e; }
      .edge-lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #334155; }
    </style>
  </defs>

  <!-- Fond léger pour lisibilité universelle clair/sombre -->
  <rect x="8" y="8" width="920" height="344" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 1. Client de test HTTP -->
  <rect x="24" y="108" width="154" height="104" rx="10" fill="#0284c7"/>
  <text x="101" y="138" text-anchor="middle" class="box-title">Client de test HTTP</text>
  <text x="101" y="158" text-anchor="middle" class="box-sub">MockMvc</text>
  <text x="101" y="175" text-anchor="middle" class="box-sub">ou RestTestClient</text>
  <text x="101" y="195" text-anchor="middle" class="box-sub">Requêtes HTTP + JSON</text>

  <!-- Flèche Client -> Périmètre réel -->
  <line x1="178" y1="160" x2="216" y2="160" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="197" y="148" text-anchor="middle" class="edge-lbl">HTTP</text>

  <!-- 2. Périmètre réel testé (Appli Spring Boot + BDD réelle de test) -->
  <rect x="220" y="24" width="440" height="312" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="46" text-anchor="middle" class="zone-title">Périmètre réel testé (aucun mock interne)</text>

  <!-- Sous-cadre : Processus Application Spring Boot -->
  <rect x="236" y="60" width="408" height="168" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="440" y="80" text-anchor="middle" class="app-title">Application Spring Boot (contexte partagé)</text>

  <!-- Chaîne interne -->
  <rect x="248" y="96" width="114" height="58" rx="8" fill="#059669"/>
  <text x="305" y="120" text-anchor="middle" class="box-title">Sécurité &amp; MVC</text>
  <text x="305" y="138" text-anchor="middle" class="box-sub">Filtres, @Valid, JSON</text>

  <line x1="362" y1="125" x2="380" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="384" y="96" width="108" height="58" rx="8" fill="#10b981"/>
  <text x="438" y="120" text-anchor="middle" class="box-title">@Service</text>
  <text x="438" y="138" text-anchor="middle" class="box-sub">Logique métier</text>

  <line x1="492" y1="125" x2="510" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="514" y="96" width="116" height="58" rx="8" fill="#0d9488"/>
  <text x="572" y="120" text-anchor="middle" class="box-title">@Repository</text>
  <text x="572" y="138" text-anchor="middle" class="box-sub">JPA / SQL natif</text>

  <text x="440" y="198" text-anchor="middle" class="edge-lbl">Sécurité, mapping JPA, requêtes SQL et sérialisation JSON réels</text>

  <!-- Flèche Repository -> BDD -->
  <line x1="572" y1="154" x2="572" y2="256" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="606" y="244" text-anchor="middle" class="edge-lbl">JDBC</text>

  <!-- 3. Base de données de test (dans le périmètre réel, hors JVM Spring si Testcontainers) -->
  <rect x="316" y="260" width="314" height="60" rx="10" fill="#334155"/>
  <text x="473" y="285" text-anchor="middle" class="box-title">Base de données de test (réelle)</text>
  <text x="473" y="303" text-anchor="middle" class="box-sub">H2 en mémoire (JPA) ou Testcontainers PostgreSQL</text>

  <!-- 4. Frontières externes simulées -->
  <rect x="720" y="24" width="190" height="312" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="815" y="48" text-anchor="middle" class="ext-title">Frontières simulées</text>

  <rect x="736" y="72" width="158" height="68" rx="8" fill="#d97706"/>
  <text x="815" y="100" text-anchor="middle" class="box-title">APIs HTTP externes</text>
  <text x="815" y="120" text-anchor="middle" class="box-sub">HttpServer / WireMock</text>

  <rect x="736" y="158" width="158" height="68" rx="8" fill="#b45309"/>
  <text x="815" y="186" text-anchor="middle" class="box-title">Horloge système</text>
  <text x="815" y="206" text-anchor="middle" class="box-sub">java.time.Clock</text>

  <rect x="736" y="244" width="158" height="68" rx="8" fill="#92400e"/>
  <text x="815" y="272" text-anchor="middle" class="box-title">Messagerie / Brokers</text>
  <text x="815" y="292" text-anchor="middle" class="box-sub">GreenMail / Testcontainers</text>

  <!-- Flèche Spring -> Frontières -->
  <line x1="644" y1="125" x2="732" y2="125" stroke="#d97706" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arrow-ext)"/>
  <text x="690" y="114" text-anchor="middle" class="edge-lbl" style="fill: #92400e;">Appels I/O</text>
</svg>
